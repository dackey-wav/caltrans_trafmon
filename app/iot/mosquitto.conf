# Broker for the IoT demo.
# 1883: MQTT for the sensor and predictor nodes (other machines on the LAN too).
# 9001: MQTT over WebSockets for a browser dashboard.
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# Anonymous access is fine on one PC. Before opening the port to a second
# device, create a password file and switch to it:
#   docker compose exec mqtt mosquitto_passwd -c /mosquitto/config/passwd sensor
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
allow_anonymous true

# Persistent sessions: the predictor's QoS 1 queue survives a broker restart.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 20000
log_type error
log_type warning
log_type notice
connection_messages true
