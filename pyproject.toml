[project]
name = "caltrans-trafmon"
version = "0.1.0"
description = "Traffic monitoring toolkit: ClickHouse ingest, FastAPI, React dashboard, offline ML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.2.25",
    "clickhouse-connect==0.15.1",
    "dotenv==0.9.9",
    "fastapi==0.115.0",
    "h11==0.16.0",
    "holidays>=0.107",
    "httpcore==1.0.9",
    "idna==3.11",
    "lz4==4.4.5",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "pyarrow==19.0.1",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "python-dotenv==1.2.2",
    "pytz==2026.1.post1",
    "starlette==0.38.6",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2025.2",
    "urllib3==2.6.3",
    "uvicorn==0.47.0",
    "zstandard==0.25.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",
    "diff-cover>=9.0",
    "httpx==0.28.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]
iot = [
    "paho-mqtt==2.1.0",
]
ml = [
    "scikit-learn>=1.5",
    "einops>=0.7.0",
]
ml-cpu = [
    { include-group = "ml" },
    "torch",
    "torchvision",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "models", "tests", "scripts"]
extend-exclude = [
    "models/TimesNet/layers",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast tests without external services",
    "integration_ch: tests that require a running ClickHouse instance",
    "ml_cpu: PyTorch CPU smoke and model unit tests",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app", "models"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "models"]
